[package]
name = "v8"
version = "145.0.0"
edition = "2024"
publish = false

[features]
default = ["use_custom_libcxx"]
use_custom_libcxx = ["lumina-v8-engine/use_custom_libcxx"]
v8_enable_pointer_compression = ["lumina-v8-engine/v8_enable_pointer_compression"]
v8_enable_sandbox = ["lumina-v8-engine/v8_enable_sandbox"]
v8_enable_v8_checks = ["lumina-v8-engine/v8_enable_v8_checks"]

[dependencies]
lumina-v8-engine = { path = "../lumina-v8-engine" }

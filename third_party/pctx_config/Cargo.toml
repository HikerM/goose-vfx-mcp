[package]
name = "pctx_config"
version = "0.1.5"
edition = "2024"
license = "MIT"
description = "Configuration management for pctx toolkit without remote telemetry exporters"
repository = "https://github.com/portofcontext/pctx"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
camino = { version = "1", features = ["serde1"] }
http = "1"
indexmap = { version = "2", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json", "cookies", "gzip", "brotli", "deflate", "zstd", "charset", "http2", "stream", "blocking"] }
rmcp = { version = "1.2.0", features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "process"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }

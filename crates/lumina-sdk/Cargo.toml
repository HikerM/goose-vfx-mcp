[package]
name = "lumina-sdk"
version = "0.1.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for Lumina with optional uniffi bindings for Python/Kotlin"

[lib]
name = "lumina_sdk"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "lumina-uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]

[features]
default = []
uniffi = [
    "dep:uniffi",
    "dep:thiserror",
    "dep:anyhow",
    "dep:lumina-providers",
    "dep:futures",
    "dep:serde_json",
    "dep:tokio",
]

[dependencies]
lumina-sdk-types = { version = "0.1.0-alpha.0", path = "../lumina-sdk-types" }
agent-client-protocol = { workspace = true, features = ["unstable"] }
agent-client-protocol-schema = { workspace = true }

uniffi = { version = "0.32", features = ["cli"], optional = true }
thiserror = { version = "2", optional = true }
lumina-providers = { version = "0.1.0-alpha.0", path = "../lumina-providers", features = ["rustls-tls"], optional = true }
futures = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"], optional = true }
anyhow = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-std", "io-util"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }

[package.metadata.cargo-machete]
# Used to provide extras imports for agent-client-protocol
ignored = ["agent-client-protocol-schema"]

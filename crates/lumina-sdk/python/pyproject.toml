[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina-sdk"
version = "0.1.0a0"
description = "Python bindings for the Lumina SDK"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Lumina contributors" }]
keywords = ["lumina", "sdk", "ai", "agent", "uniffi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/HikerM/lumina"
Repository = "https://github.com/HikerM/lumina"
Issues = "https://github.com/HikerM/lumina/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumina = ["*.so", "*.dylib", "*.dll", "py.typed"]
